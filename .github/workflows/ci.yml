name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml

      - name: Go vet & unit tests
        run: |
          go vet ./...
          go test -v -race ./...

      - name: Download nginx-ui CLI
        run: |
          curl -fsSL https://github.com/0xJacky/nginx-ui/releases/latest/download/nginx-ui-linux-64.tar.gz -o /tmp/nginx-ui.tar.gz
          mkdir -p /tmp/nginx-ui-bin
          tar -xzf /tmp/nginx-ui.tar.gz -C /tmp/nginx-ui-bin
          chmod +x /tmp/nginx-ui-bin/nginx-ui

      - name: Build, lint, conformance & pack
        run: ./build.sh --conformance --no-sign --nginx-ui /tmp/nginx-ui-bin/nginx-ui
